name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows MSVC (${{ matrix.profile }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [release, debug]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache build
        uses: actions/cache@v5
        with:
          path: build/ci-windows-${{ matrix.profile }}
          key: ci-windows-${{ matrix.profile }}-${{ hashFiles('CMakeLists.txt', 'CMake/**/*.cmake', 'Src/CMakeLists.txt', 'Vendor/CMakeLists.txt', 'Tests/CMakeLists.txt', 'CMakePresets.json', 'CMake/Presets/configure/windows.json', 'CMake/Presets/build/windows.json', 'CMake/Presets/test/windows.json', 'CMake/Presets/test/common.json') }}
          restore-keys: ci-windows-

      - name: Configure
        run: cmake --preset ci-windows-${{ matrix.profile }}

      - name: Build
        run: cmake --build --preset build-ci-windows-${{ matrix.profile }} --parallel

      - name: Test
        run: ctest --preset test-ci-windows-${{ matrix.profile }}

  linux:
    name: Linux GCC (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [release, debug]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libgl-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev

      - name: Cache build
        uses: actions/cache@v5
        with:
          path: build/ci-linux-${{ matrix.profile }}
          key: ci-linux-${{ matrix.profile }}-${{ hashFiles('CMakeLists.txt', 'CMake/**/*.cmake', 'Src/CMakeLists.txt', 'Vendor/CMakeLists.txt', 'Tests/CMakeLists.txt', 'CMakePresets.json', 'CMake/Presets/configure/linux.json', 'CMake/Presets/build/linux.json', 'CMake/Presets/test/linux.json', 'CMake/Presets/test/common.json') }}
          restore-keys: ci-linux-

      - name: Configure
        run: cmake --preset ci-linux-${{ matrix.profile }}

      - name: Build
        run: cmake --build --preset build-ci-linux-${{ matrix.profile }} --parallel

      - name: Test
        run: ctest --preset test-ci-linux-${{ matrix.profile }}

  macos:
    name: macOS Clang (${{ matrix.profile }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [release, debug]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Cache build
        uses: actions/cache@v5
        with:
          path: build/ci-macos-${{ matrix.profile }}
          key: ci-macos-${{ matrix.profile }}-${{ hashFiles('CMakeLists.txt', 'CMake/**/*.cmake', 'Src/CMakeLists.txt', 'Vendor/CMakeLists.txt', 'Tests/CMakeLists.txt', 'CMakePresets.json', 'CMake/Presets/configure/macos.json', 'CMake/Presets/build/macos.json', 'CMake/Presets/test/macos.json', 'CMake/Presets/test/common.json') }}
          restore-keys: ci-macos-

      - name: Configure
        run: cmake --preset ci-macos-${{ matrix.profile }}

      - name: Build
        run: cmake --build --preset build-ci-macos-${{ matrix.profile }} --parallel

      - name: Test
        run: ctest --preset test-ci-macos-${{ matrix.profile }}
